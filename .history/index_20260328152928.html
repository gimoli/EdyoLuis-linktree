<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdyoLuis - Linktree</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        .profile {
            margin-bottom: 30px;
        }
        
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 4px solid white;
            object-fit: cover;
        }
        
        h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .bio {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .link {
            background: white;
            color: #667eea;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .link:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <img src="avatar.jpg" alt="Avatar" class="avatar">
            <h1>EdyoLuis</h1>
            <p class="bio">Your bio here</p>
        </div>
        
        <div class="links">
            <a href="#" class="link">Instagram</a>
            <a href="#" class="link">Twitter</a>
            <a href="#" class="link">YouTube</a>
            <a href="#" class="link">TikTok</a>
        </div>
    </div>
</body>
</html>
